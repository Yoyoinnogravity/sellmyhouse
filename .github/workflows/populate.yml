name: Populate developments

# Every 15 minutes, ask the live site to import a few more real
# developments from Malaysia's public housing register.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import a batch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          AUTH=()
          if [ -n "$CRON_SECRET" ]; then AUTH=(-H "Authorization: Bearer $CRON_SECRET"); fi
          OUT=$(curl -sS --max-time 90 "${AUTH[@]}" https://sellmyhouse.asia/api/cron/developments 2>&1 | head -c 3000)
          echo "$OUT"
          # Also as a notice, so the result shows on the run's summary page.
          echo "::notice title=Import result::$(echo "$OUT" | tr '\n' ' ' | head -c 900)"
          MEDIA=$(curl -sS --max-time 90 "${AUTH[@]}" https://sellmyhouse.asia/api/cron/media 2>&1 | head -c 3000)
          echo "$MEDIA"
          echo "::notice title=Photos result::$(echo "$MEDIA" | tr '\n' ' ' | head -c 900)"
