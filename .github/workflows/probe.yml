name: Probe register
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | tr -s ' ' | head -c 950)"; }
          H=$(curl -sL -m 30 -A 'Mozilla/5.0' -o /tmp/p.html -w '%{http_code} %{url_effective}' https://lppeh.gov.my/ || true)
          note home "$H $(grep -io 'href=\"[^\"]*\(carian\|search\|daftar\|register\|senarai\|firm\|direktori\|directory\)[^\"]*\"' /tmp/p.html | sort -u | head -30 | tr '\n' ' ')"
          H=$(curl -skL -m 30 -A 'Mozilla/5.0' -o /tmp/q.html -w '%{http_code} %{url_effective}' https://lpeph.gov.my/search-listing || true)
          note lpeph "$H $(grep -io '<form[^>]*>\|<input[^>]*>\|<select[^>]*name=[^>]*>\|fetch([^)]*)\|/api/[a-zA-Z/_-]*' /tmp/q.html | head -30 | tr '\n' ' ')"
