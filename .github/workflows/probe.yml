name: Probe public data APIs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | head -c 950)"; }
          note DVFdir "$(curl -sL -m 30 'https://files.data.gouv.fr/geo-dvf/latest/csv/' | sed 's/<[^>]*>/ /g' | tr -s ' ' | head -c 600)"
          note DVFfile "$(curl -sL -m 60 -w ' HTTP%{http_code}' 'https://files.data.gouv.fr/geo-dvf/latest/csv/2024/communes/06/06088.csv' | head -c 700)"
          Q='PREFIX lrppi: <http://landregistry.data.gov.uk/def/ppi/> PREFIX lrcommon: <http://landregistry.data.gov.uk/def/common/> SELECT ?price ?date ?pc WHERE { ?addr lrcommon:postcode "BA1 1LZ" . ?tx lrppi:propertyAddress ?addr ; lrppi:pricePaid ?price ; lrppi:transactionDate ?date . ?addr lrcommon:postcode ?pc } LIMIT 2'
          note LRsparql "$(curl -sL -m 90 -w ' HTTP%{http_code}' -G 'https://landregistry.data.gov.uk/landregistry/query' --data-urlencode "query=$Q" --data-urlencode 'output=json' 2>&1 | head -c 900)"
          note LRapi "$(curl -sL -m 60 -w ' HTTP%{http_code}' 'https://landregistry.data.gov.uk/data/ppi/transaction-record.json?propertyAddress.postcode=BA1+1LZ&_pageSize=1' 2>&1 | head -c 600)"
          note DLD "$(curl -sL -m 30 -w ' HTTP%{http_code}' 'https://www.dubaipulse.gov.ae/dataset/dld-transactions-open' 2>&1 | sed 's/<[^>]*>/ /g' | tr -s ' ' | grep -o 'Download[^ ]*\|csv[^ ]*\|HTTP[0-9]*' | head -c 400)"
