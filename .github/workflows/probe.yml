name: Probe public data APIs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | head -c 950)"; }
          Q='PREFIX lrppi: <http://landregistry.data.gov.uk/def/ppi/> PREFIX lrcommon: <http://landregistry.data.gov.uk/def/common/> SELECT ?price ?date ?paon ?street ?town ?pc ?type WHERE { ?addr lrcommon:postcode ?pc . FILTER(STRSTARTS(?pc, "BA1 1")) ?tx lrppi:propertyAddress ?addr ; lrppi:pricePaid ?price ; lrppi:transactionDate ?date ; lrppi:propertyType ?type . OPTIONAL {?addr lrcommon:paon ?paon} OPTIONAL {?addr lrcommon:street ?street} OPTIONAL {?addr lrcommon:town ?town} } ORDER BY DESC(?date) LIMIT 2'
          note LRsparql "$(curl -s -m 60 -G 'https://landregistry.data.gov.uk/landregistry/query' --data-urlencode "query=$Q" -H 'Accept: application/sparql-results+json')"
          note GEOFR "$(curl -s -m 30 'https://geo.api.gouv.fr/communes?nom=Nice&fields=code,nom,codeDepartement,population&boost=population&limit=2')"
          note DVF "$(curl -s -m 60 'https://files.data.gouv.fr/geo-dvf/latest/csv/2025/communes/06/06088.csv' | head -c 700)"
          note DVFyears "$(curl -s -m 30 'https://files.data.gouv.fr/geo-dvf/latest/csv/' | grep -o 'href="[0-9]*/' | tr '\n' ' ')"
          note PPR "$(curl -s -m 60 -I 'https://www.propertypriceregister.ie/website/npsra/ppr/npsra-ppr.nsf/Downloads/PPR-ALL.zip/$FILE/PPR-ALL.zip' | head -5)"
          note DLD "$(curl -s -m 30 -I 'https://www.dubaipulse.gov.ae/dataset/dld-transactions-open' | head -3)"
          note DLDapi "$(curl -s -m 30 'https://www.dubaipulse.gov.ae/data/dld-transactions/dld_transactions-open' | head -c 400)"
